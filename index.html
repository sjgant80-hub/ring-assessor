<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-assessor · root-cause prioritiser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#15161f;--border:#2a2c3a;--text:#e6e7ee;--dim:#9296a6;--root:#4caf50;--sym:#f0c040;--accent:#6c8cff;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem}
.wrap{width:100%;max-width:40rem}
h1{font-size:1.5rem}.sub{color:var(--dim);font-size:.9rem;margin-bottom:.4rem}
.scope{color:var(--dim);font-size:.76rem;border-left:2px solid var(--sym);padding-left:.6rem;margin-bottom:1rem;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;padding:1.1rem;margin-bottom:1rem}
button{padding:.5rem .9rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:.4rem;cursor:pointer;font-size:.85rem;margin-right:.4rem}
button.go{border-color:var(--accent);color:var(--accent)}
svg{width:100%;max-width:260px;display:block;margin:.6rem auto}
.rank{font-family:ui-monospace,monospace;font-size:.76rem;margin-top:.5rem}
.rank .row{display:flex;gap:.5rem;padding:.2rem 0}
.rank .row.root b{color:var(--root)}
.advice{color:var(--root);font-size:.86rem;margin-top:.6rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>ring-assessor</h1>
  <p class="sub">Fix the deepest significant thing first — the symptoms often clear with it.</p>
  <p class="scope">Not medical or diagnostic. You declare which layer is upstream (layer 0 = deepest); it prioritises within your model. A triage helper for incidents, pipelines, dependencies — not bodies.</p>
  <div class="card">
    <button class="go" onclick="demo()">Example: a service incident</button>
    <svg id="rings" viewBox="-105 -105 210 210"></svg>
    <div class="advice" id="advice"></div>
    <div class="rank" id="rank"></div>
  </div>
</div>
<script type="module">
import { assess } from './ring.mjs';
const findings = [
  { id:'disk-io saturated', layer:0, severity:0.7 },
  { id:'db slow queries',   layer:1, severity:0.6 },
  { id:'api timeouts',      layer:2, severity:0.85 },
  { id:'checkout errors',   layer:3, severity:0.95 },
];
window.demo = () => {
  const r = assess(findings);
  const maxL = Math.max(...findings.map(f=>f.layer));
  const svg = document.getElementById('rings');
  svg.innerHTML = findings.slice().sort((a,b)=>b.layer-a.layer).map(f=>{
    const rad = 20 + (f.layer/maxL)*80;
    const isRoot = r.root && f.id===r.root.id;
    const col = isRoot ? '#4caf50' : `rgba(240,192,64,${0.25+f.severity*0.55})`;
    return `<circle cx="0" cy="0" r="${rad}" fill="none" stroke="${col}" stroke-width="${isRoot?4:2}"/>`+
      `<text x="0" y="${-rad+11}" font-size="7" fill="#9296a6" text-anchor="middle">${f.id}</text>`;
  }).join('');
  document.getElementById('advice').textContent = r.advice || '';
  document.getElementById('rank').innerHTML = '<div style="color:var(--dim)">fix order:</div>' + r.ranked.map((f,i)=>
    `<div class="row ${r.root&&f.id===r.root.id?'root':''}"><span style="width:1.2rem">${i+1}.</span><b>${f.id}</b><span style="color:var(--dim)">layer ${f.layer} · sev ${f.severity} · +${r.distanceFromRoot[f.id]} from root</span></div>`).join('');
};
demo();
</script>
</body>
</html>
